<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>📝 To-Do List</h1>

    <form id="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="Add a new task…"
        autocomplete="off"
        required
      />
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>

    <p id="empty-msg" class="empty-msg">No tasks yet. Add one above!</p>

    <div class="actions">
      <button id="clear-completed" class="secondary">Clear completed</button>
      <span id="task-count" class="count"></span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
